[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-bedrock-idc"
version = "0.1.0"
description = "Generate Claude Code and Cowork-on-3P settings for Amazon Bedrock with IAM Identity Center from a single YAML file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_bedrock_idc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
